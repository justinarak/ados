apiVersion: apps/v1
kind: Deployment
metadata:
  name: ados-gateway
  labels:
    app: ados-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: ados-gateway
  template:
    metadata:
      labels:
        app: ados-gateway
    spec:
      containers:
        - name: ados-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
